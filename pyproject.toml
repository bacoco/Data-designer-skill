[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "data-designer-skill"
version = "1.0.0"
description = "Claude Code skill for synthetic dataset generation"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
keywords = ["synthetic-data", "dataset", "claude", "llm", "data-generation", "claude-code", "skill"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "faker>=20.0.0",
    "pyyaml>=6.0",
    "jinja2>=3.1.0",
    "jsonschema>=4.0.0",
]

[project.optional-dependencies]
parquet = [
    "pandas>=2.0.0",
    "pyarrow>=14.0.0",
]
lint = [
    "ruff>=0.1.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "pandas>=2.0.0",
    "pyarrow>=14.0.0",
]

[tool.black]
line-length = 100
target-version = ["py39", "py310", "py311", "py312"]

[tool.ruff]
line-length = 100
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts"]
